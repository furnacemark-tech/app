name: Isolated CI tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Yarn 1.22.22
        run: |
          npm install --global yarn@1.22.22
          test "$(yarn --version)" = "1.22.22"

      # The URL filename says 1.0.13, but the tarball package metadata declares 1.0.12.
      - name: Verify visual-edits tarball SHA-256
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/emergentbase-visual-edits-1.0.13.tgz \
            https://assets.emergent.sh/npm/emergentbase-visual-edits-1.0.13.tgz
          printf '%s  %s\n' \
            '9ea2c246c127a218d1ed7eb15d0137ab62489aae6cc4ff7b7b9d5001f08bed9b' \
            '/tmp/emergentbase-visual-edits-1.0.13.tgz' \
            | sha256sum -c

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run frontend tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false --runInBand

      - name: Build frontend
        working-directory: frontend
        run: CI=true yarn build

  backend:
    name: Isolated backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: lims_ci
      JWT_SECRET: test-only-secret-for-isolated-ci
    steps:
      # actions/checkout v4.2.2
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install audited backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            fastapi==0.110.1 \
            uvicorn==0.25.0 \
            motor==3.3.1 \
            pymongo==4.6.3 \
            bcrypt==4.1.3 \
            PyJWT==2.13.0 \
            python-dotenv==1.2.2 \
            pydantic==2.13.4 \
            reportlab==5.0.0 \
            pypdf==6.10.0 \
            requests==2.34.2 \
            pytest==9.1.1 \
            pytest-xdist==3.8.0

      - name: Run isolated backend tests and assert safety outputs
        shell: bash
        run: |
          set +e
          python scripts/run_isolated_backend_tests.py 2>&1 | tee "$RUNNER_TEMP/isolated-backend-tests.log"
          runner_status=${PIPESTATUS[0]}
          set -e

          if grep -Fxq "PREVIEW_COUNTS_UNCHANGED=True" "$RUNNER_TEMP/isolated-backend-tests.log"; then
            preview_status=0
          else
            preview_status=1
          fi
          if grep -Fxq "DISPOSABLE_DATABASE_REMOVED=True" "$RUNNER_TEMP/isolated-backend-tests.log"; then
            cleanup_status=0
          else
            cleanup_status=1
          fi

          if [ "$runner_status" -ne 0 ]; then
            exit "$runner_status"
          fi
          if [ "$preview_status" -ne 0 ] || [ "$cleanup_status" -ne 0 ]; then
            echo "Isolated backend safety output assertions failed."
            exit 1
          fi
