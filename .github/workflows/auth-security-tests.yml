name: LIMS Authentication Security Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/auth-security-tests.yml"

permissions:
  contents: read

jobs:
  authentication-tests:
    name: Authentication regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: lims_auth_test
      JWT_SECRET: github-actions-test-secret-not-for-production
      FRONTEND_URL: http://localhost:3000
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
      LIMS_ENABLE_TEST_ACCOUNTS: "true"
      COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.110.1 \
            uvicorn==0.25.0 \
            motor==3.3.1 \
            pymongo==4.6.3 \
            bcrypt==4.1.3 \
            PyJWT==2.13.0 \
            python-dotenv==1.2.2 \
            pydantic==2.13.4 \
            reportlab==5.0.0 \
            pypdf==6.10.0 \
            requests==2.34.2 \
            pytest==9.1.1 \
            pytest-xdist==3.8.0

      - name: Create test accounts
        run: python scripts/seed_test_accounts.py

      - name: Start LIMS backend
        run: |
          cd backend
          nohup uvicorn server:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/lims-backend.log 2>&1 &
          echo $! > /tmp/lims-backend.pid

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/auth/provisioning-status \
              > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not start."
          cat /tmp/lims-backend.log
          exit 1

      - name: Run complete backend test suite
        working-directory: backend
        run: pytest -v

      - name: Show backend log after failure
        if: failure()
        run: cat /tmp/lims-backend.log
